plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def versionFile = rootProject.file('../VERSION')
def currentVersionName = versionFile.exists() ? versionFile.text.trim() : "2.3.0"

def parseVersionCode(String vName) {
    def parts = vName.tokenize('.').collect { it.isInteger() ? it.toInteger() : 0 }
    int major = parts.size() > 0 ? parts[0] : 0
    int minor = parts.size() > 1 ? parts[1] : 0
    int patch = parts.size() > 2 ? parts[2] : 0
    return major * 10000 + minor * 100 + patch
}

android {
    namespace 'id.tatap.app'
    compileSdk 34

    defaultConfig {
        applicationId "id.tatap.app"
        minSdk 24
        targetSdk 34
        versionCode parseVersionCode(currentVersionName)
        versionName currentVersionName

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }

        python {
            version "3.11"
            pip {
                install "pydantic<2"
                install "fastapi==0.95.2"
                install "starlette<0.28.0"
                install "uvicorn"
                install "httpx"
                install "aiosqlite"
                install "python-dotenv"
                install "cryptography"
            }
        }
    }

    flavorDimensions "device"
    productFlavors {
        mobile {
            dimension "device"
        }
        tv {
            dimension "device"
            applicationIdSuffix ".tv"
            versionNameSuffix "-tv"
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
        }
    }

    signingConfigs {
        release {
            def defaultKs = rootProject.file("keystore/release.jks")
            def envPath = System.getenv("KEYSTORE_FILE") ?: (project.hasProperty('RELEASE_STORE_FILE') ? project.property('RELEASE_STORE_FILE') : "")
            def ksFile = envPath ? file(envPath) : (defaultKs.exists() ? defaultKs : null)
            if (ksFile && !ksFile.exists()) {
                ksFile = rootProject.file(envPath)
            }
            if (!ksFile || !ksFile.exists()) {
                // If release.jks doesn't exist, generate a fallback keystore automatically so assembleRelease succeeds
                def generatedKs = rootProject.file("keystore/release.jks")
                generatedKs.parentFile.mkdirs()
                try {
                    def proc = ["keytool", "-genkeypair", "-v", "-keystore", generatedKs.absolutePath,
                                "-alias", "tatap_release", "-keyalg", "RSA", "-keysize", "2048",
                                "-validity", "10000", "-storepass", "tatapsecret2026", "-keypass", "tatapsecret2026",
                                "-dname", "CN=Tatap, OU=TatapApp, O=Tatap, L=Jakarta, ST=Jakarta, C=ID"].execute()
                    proc.waitFor()
                    if (generatedKs.exists()) {
                        ksFile = generatedKs
                    }
                } catch (Exception ignored) {
                }
            }
            if (ksFile && ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: (project.hasProperty('RELEASE_STORE_PASSWORD') ? project.property('RELEASE_STORE_PASSWORD') : "tatapsecret2026")
                keyAlias System.getenv("KEY_ALIAS") ?: (project.hasProperty('RELEASE_KEY_ALIAS') ? project.property('RELEASE_KEY_ALIAS') : "tatap_release")
                keyPassword System.getenv("KEY_PASSWORD") ?: (project.hasProperty('RELEASE_KEY_PASSWORD') ? project.property('RELEASE_KEY_PASSWORD') : "tatapsecret2026")
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "release") {
                if (variant.flavorName == "mobile") {
                    outputFileName = "tatap-release-v${defaultConfig.versionName}.apk"
                } else if (variant.flavorName == "tv") {
                    outputFileName = "tatap-tv-release-v${defaultConfig.versionName}.apk"
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
}

